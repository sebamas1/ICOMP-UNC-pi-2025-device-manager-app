# Reglas de ramas:
# - No push directo a develop ni a main. Merge solo por PR.
# - PR / push a develop → CI (tests + SonarCloud) + publicar imagen en ECR repo DEVELOP.
# - PR / push a main → CI (tests + SonarCloud) + publicar imagen en ECR repo MAIN.
#
# SonarCloud: configurar en el repo Secrets (SONAR_TOKEN) y Variables (SONAR_ORGANIZATION, SONAR_PROJECT_KEY).
name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_DEVELOP: b4c0c6w7/tesis/tp1-frontend
  ECR_REPOSITORY_MAIN: b4c0c6w7/tesis/tp1-frontend-prd

permissions:
  contents: read

jobs:
  ci:
    name: Tests & SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # SonarCloud en un solo paso (no hay "begin/end" como en .NET: el action corre el scanner completo).
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        with:
          projectKey: ${{ vars.SONAR_PROJECT_KEY }}
          organization: ${{ vars.SONAR_ORGANIZATION }}
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  build-and-push:
    name: Build Docker & Push ECR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set ECR repository
        id: ecr
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "repository=${{ env.ECR_REPOSITORY_MAIN }}" >> $GITHUB_OUTPUT
          else
            echo "repository=${{ env.ECR_REPOSITORY_DEVELOP }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          echo "Building image for branch: ${{ github.ref_name }}"
          docker build -f docker-config/Dockerfile -t app:$IMAGE_TAG .

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ steps.ecr.outputs.repository }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          docker tag app:$IMAGE_TAG $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
